version: "3.9"

services:
  medicalcare-api:
    build: .
    container_name: medicalcare-api
    ports:
      - "8080:8080"
    depends_on:
      - medicalcare-db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: >
        Server=medicalcare-db,1433;
        Database=MedicalCareDb;
        User Id=sa;
        Password=StrongPass@123;
        TrustServerCertificate=True;
    restart: always

  medicalcare-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: medicalcare-db
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "StrongPass@123"
    volumes:
      - sql_data:/var/opt/mssql
    restart: always

volumes:
  sql_data:
